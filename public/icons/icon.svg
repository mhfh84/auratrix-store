<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="240" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" />

  <!-- Auratrix "A" Emblem with Shopping Bag & Diamond Motif -->
  <g transform="translate(0, 10)">
    <!-- Shopping Bag Handle Accent -->
    <path d="M196 180 C 196 125, 316 125, 316 180" fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round" />
    
    <!-- Outer Stylized "A" Triangle / Wings -->
    <path d="M256 120 L380 370 L320 370 L256 240 L192 370 L132 370 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
    
    <!-- Inner Diamond Core -->
    <polygon points="256,190 295,270 256,320 217,270" fill="url(#accentGrad)" />
    <polygon points="256,210 280,265 256,300 232,265" fill="#ffffff" opacity="0.85" />
    
    <!-- Crossbar Glow Line -->
    <line x1="165" y1="330" x2="347" y2="330" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Brand Subtext Dots -->
  <circle cx="216" cy="425" r="5" fill="#818cf8" />
  <circle cx="256" cy="425" r="7" fill="#38bdf8" />
  <circle cx="296" cy="425" r="5" fill="#818cf8" />
</svg>
